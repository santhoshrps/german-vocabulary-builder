# Leaderboard worker — two fully isolated environments (LB3-NFR-12, owner 2026-07-25:
# dev + prod, no standing test; scratch resources per run live in ../leaderboard-rig).
#
#   prod (top level)  → the live app.            Deploy ONLY via scripts/deploy.sh.
#   [env.dev]         → Xcode DEBUG builds + TestFlight phones flipped to Development.
#
# Named environments do NOT inherit vars or bindings — every block re-declares its
# full configuration; the deploy script verifies secret parity (names only) and
# asserts /health after deploy, exactly like the read worker.
#
# STATUS: configuration only. `main` and src/ land with the first implementation
# batch AFTER owner approval (spec §6.5 gate) — `wrangler deploy` fails until then,
# deliberately. Database ids recorded 2026-07-25 from the owner's `d1 create` runs.
#
# Store split (capacity-model.md §6): SOCIAL_DB (relational + registers),
# ERASURE_DB (deletion journal — never restored behind SOCIAL_DB), PROJECTION_1
# (per-player day-state; PROJECTION_2+ created by assignment cap, never migrated).
#
# Queue policy (LB3-NFR-1b, owner 2026-07-26): every environment has an isolated
# primary Queue and DLQ. D1 remains authoritative until terminal completion.
# Batches of 5 and concurrency 2 bound D1 contention while allowing a slow Apple
# revocation not to block cleanup. A 2-second batch timeout keeps erasure latency
# low; five 60-second Queue retries cover transient faults before DLQ while the
# 30-minute D1 dispatch lease independently recreates delivery.

name = "german-vocabulary-leaderboard-worker"
main = "src/index.ts"
compatibility_date = "2024-09-23"

# ---------------------------------------------------------------------------
# PROD
# ---------------------------------------------------------------------------

[[d1_databases]]
binding = "SOCIAL_DB"
database_name = "german-social-prod"
database_id = "5c9e8d17-7dc6-4b8e-a11c-6308298a19ad"
migrations_dir = "migrations/social"

[[d1_databases]]
binding = "ERASURE_DB"
database_name = "german-erasure-prod"
database_id = "f9a8e719-88db-4981-82b5-66645050b0d7"
migrations_dir = "migrations/erasure"

[[d1_databases]]
binding = "PROJECTION_1"
database_name = "german-projection-1-prod"
database_id = "883f9907-463b-47b9-9bef-ab50be6707e1"
migrations_dir = "migrations/projection"

[[queues.producers]]
binding = "SOCIAL_OUTBOX"
queue = "german-social-outbox-prod"

[[queues.consumers]]
queue = "german-social-outbox-prod"
max_batch_size = 5
max_batch_timeout = 2
max_retries = 5
retry_delay = 60
max_concurrency = 2
dead_letter_queue = "german-social-outbox-dlq-prod"

[triggers]
crons = ["*/15 * * * *"]  # D1→Queue recovery + aggregate health; never direct execution

[observability]
enabled = true

[vars]
ENV_NAME = "prod"
APP_BUNDLE_ID = "com.ramapurampalanivel.germanwords"
# Application tenant — the URL's first path segment. Later languages get their own
# slug, bindings and databases; this value is never derived from a request.
APP_SLUG = "german"
SOCIAL_OUTBOX_QUEUE = "german-social-outbox-prod"
# Invite links (owner decision 2026-07-25): learn-languages.app/german/join#<token>
INVITE_LINK_BASE = "https://learn-languages.app/german/join"

# ---------------------------------------------------------------------------
# DEV
# ---------------------------------------------------------------------------

[[env.dev.d1_databases]]
binding = "SOCIAL_DB"
database_name = "german-social-dev"
database_id = "650c877d-519d-4fd8-9205-a4b933deccc0"
migrations_dir = "migrations/social"

[[env.dev.d1_databases]]
binding = "ERASURE_DB"
database_name = "german-erasure-dev"
database_id = "50bdd9a1-8bb6-410e-97af-375da3f7e560"
migrations_dir = "migrations/erasure"

[[env.dev.d1_databases]]
binding = "PROJECTION_1"
database_name = "german-projection-1-dev"
database_id = "dafe72ab-ec6d-4678-9578-01f64f48b822"
migrations_dir = "migrations/projection"

[[env.dev.queues.producers]]
binding = "SOCIAL_OUTBOX"
queue = "german-social-outbox-dev"

[[env.dev.queues.consumers]]
queue = "german-social-outbox-dev"
max_batch_size = 5
max_batch_timeout = 2
max_retries = 5
retry_delay = 60
max_concurrency = 2
dead_letter_queue = "german-social-outbox-dlq-dev"

[env.dev.triggers]
crons = ["*/15 * * * *"]

[env.dev.observability]
enabled = true

[env.dev.vars]
ENV_NAME = "dev"
APP_BUNDLE_ID = "com.ramapurampalanivel.germanwords"
# Application tenant — the URL's first path segment. Later languages get their own
# slug, bindings and databases; this value is never derived from a request.
APP_SLUG = "german"
SOCIAL_OUTBOX_QUEUE = "german-social-outbox-dev"
# Dev invite links ride the workers.dev origin (interim ruling 2026-07-25).
INVITE_LINK_BASE = ""
